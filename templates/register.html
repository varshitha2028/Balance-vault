<!DOCTYPE html>
<html>
<head>
    <title>BalanceVault Registration</title>
    <style>
        body {
            font-family: Arial;
            background: #eaf0fa;
            text-align: center;
            padding-top: 70px;
        }

        .box {
            background: white;
            padding: 30px;
            margin: auto;
            width: 320px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #bbb;
        }

        input, button {
            width: 90%;
            padding: 12px;
            margin: 10px;
            box-sizing: border-box;
        }

        button {
            background: #155eef;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="box">
    <h1>BalanceVault</h1>
    <h3>Create Your Account</h3>

    {% with messages = get_flashed_messages() %}
      {% for message in messages %}
        <p>{{ message }}</p>
      {% endfor %}
    {% endwith %}

    <form method="POST">
        <input name="username"
               placeholder="Username" required>

        <input name="password"
               type="password"
               placeholder="Password (8 characters minimum)"
               required>

        <button type="submit">Register</button>
    </form>

    <p>Already registered?</p>
    <a href="/login">Login here</a>
</div>

</body>
</html>
